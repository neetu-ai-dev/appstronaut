    <circle cx="960" cy="40" r="1.2" opacity=".6"/><circle cx="560" cy="30" r="1.2" opacity=".5"/>
    <circle cx="1230" cy="250" r="1.5" opacity=".6"/><circle cx="40" cy="220" r="1.2" opacity=".5"/>
